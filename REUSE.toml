# Third-party code and texts.
[[annotations]]
path = "docs/vision/style-studies/shared/page-kit/vendor/three/**"
SPDX-FileCopyrightText = "2010-2025 three.js authors"
SPDX-License-Identifier = "MIT"

# The inputs of city/scripts/third_party_notices.py: Godot's, Rust's and
# Emscripten's own licence files, and the MPL-2.0 text that covers godot-rust.
[[annotations]]
path = "city/packaging/licenses/MPL-2.0.txt"
precedence = "override"
SPDX-FileCopyrightText = "Mozilla Foundation"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = "city/packaging/licenses/godot/**"
precedence = "override"
SPDX-FileCopyrightText = "2014-present Godot Engine contributors; 2007-2014 Juan Linietsky, Ariel Manzur"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "city/packaging/licenses/rust/**"
precedence = "override"
SPDX-FileCopyrightText = "The Rust Project Contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = "city/packaging/licenses/emscripten/**"
precedence = "override"
SPDX-FileCopyrightText = "2010-2014 Emscripten authors"
SPDX-License-Identifier = "MIT"

# The generated third-party notices only reproduce each component's own
# notice and licence text; no rights are claimed in the compilation.
[[annotations]]
path = "THIRD-PARTY-NOTICES.txt"
precedence = "override"
SPDX-FileCopyrightText = "NONE: the notices it reproduces belong to the holders it names"
SPDX-License-Identifier = "CC0-1.0"

# The Contributor Covenant, adapted.
[[annotations]]
