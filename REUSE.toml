# Which licence covers which path, in the REUSE format
# (https://reuse.software/spec-3.3/). COPYING.md says the same in words.
# When several annotations match a file, the last one applies.
version = 1

# Everything not named below is code, configuration or data: AGPL-3.0-only.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Super Jackfruit Labs (OPC) Private Limited and contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

# Documentation, evidence, and SJL's own assets (models, sprites, textures,
# UI art, renders, captures, diagrams, Blender sources): CC BY-SA 4.0.
[[annotations]]
path = [
    "**/*.md",
    "docs/**",
    "**/evidence/**",
    "city/godot/styles/*/assets/**",
    "prototypes/**/assets/**",
    "prototypes/**/source/**",
    "**/*.png",
    "**/*.svg",
    "**/*.glb",
    "**/*.blend",
    "**/*.mp4",
]
SPDX-FileCopyrightText = "2026 Super Jackfruit Labs (OPC) Private Limited and contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Code that lives among the documentation or evidence stays AGPL-3.0-only.
[[annotations]]
path = [
    "**/evidence/**/*.py",
    "**/evidence/**/*.gd",
    "**/evidence/**/*.sh",
    "docs/**/*.py",
    "docs/**/*.gd",
    "docs/**/*.godot",
    "docs/**/*.uid",
    "docs/**/*.js",
    "docs/**/*.css",
    "docs/**/*.html",
    "docs/**/.gitignore",
    "docs/**/requirements.txt",
]
SPDX-FileCopyrightText = "2026 Super Jackfruit Labs (OPC) Private Limited and contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

# AI-generated concept art: no rights claimed, CC0 1.0. The generator is
# OpenAI gpt-image where a file carries OpenAI's C2PA credentials and is not
# recorded otherwise; the style-study gallery lists which styles are which.
[[annotations]]
path = "docs/vision/style-studies/styles/*/sheets/*/*/image.png"
SPDX-FileCopyrightText = "NONE: AI-generated concept art (OpenAI gpt-image where the file carries its C2PA credentials, otherwise generator not recorded); no rights claimed"
SPDX-License-Identifier = "CC0-1.0"

# Every image of these carries OpenAI's C2PA credentials.
[[annotations]]
path = [
    "docs/vision/style-studies/comparisons/*.png",
    "docs/vision/style-studies/styles/01-graphic/sheets/*/*/image.png",
    "docs/vision/style-studies/styles/02-voxel/sheets/*/*/image.png",
    "docs/vision/style-studies/styles/03-ink/sheets/*/*/image.png",
    "docs/vision/style-studies/styles/04-realistic/sheets/*/*/image.png",
    "docs/vision/style-studies/styles/05-claymation/sheets/*/*/image.png",
    "docs/vision/style-studies/styles/06-anime/sheets/*/*/image.png",
    "docs/vision/style-studies/styles/07-paper-craft/sheets/*/*/image.png",
    "docs/vision/style-studies/styles/08-pixel-art/sheets/*/*/image.png",
    "docs/vision/style-studies/styles/09-solarpunk/sheets/*/*/image.png",
    "docs/vision/style-studies/styles/10-neon-noir/sheets/*/*/image.png",
]
SPDX-FileCopyrightText = "NONE: AI-generated concept art (OpenAI gpt-image); no rights claimed"
SPDX-License-Identifier = "CC0-1.0"

# No image of these carries credentials or another record of the generator.
[[annotations]]
path = [
    "docs/vision/style-studies/styles/12-gouache-storybook/sheets/*/*/image.png",
    "docs/vision/style-studies/styles/17-art-nouveau-botanical/sheets/*/*/image.png",
    "docs/vision/style-studies/styles/21-brutalist-tropical-modernism/sheets/*/*/image.png",
    "docs/vision/style-studies/styles/26-soft-3d-plush-miniature/sheets/*/*/image.png",
    "docs/vision/style-studies/styles/28-ukiyo-e-woodblock-city/sheets/*/*/image.png",
    "docs/vision/style-studies/styles/29-madhubani-contemporary-city/sheets/*/*/image.png",
    "docs/vision/style-studies/styles/30-afrofuturist-maker-metropolis/sheets/*/*/image.png",
]
SPDX-FileCopyrightText = "NONE: AI-generated concept art (generator not recorded); no rights claimed"
SPDX-License-Identifier = "CC0-1.0"

# Evidence composites that set game captures beside crops of that concept
# art: SJL's composite under CC BY-SA 4.0, the embedded AI crops CC0 1.0.
[[annotations]]
path = ["city/godot/evidence/*-vs-sheet.png", "city/godot/evidence/*-vs-sheets.png"]
SPDX-FileCopyrightText = "2026 Super Jackfruit Labs (OPC) Private Limited and contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0 AND CC0-1.0"

# The asset-to-sheet pilot (docs/research/2026-10-01-asset-to-sheet-pilot/).
