[[annotations]]
path = [
    "docs/research/2026-10-01-asset-to-sheet-pilot/banyan/inputs/*.png",
    "docs/research/2026-10-01-asset-to-sheet-pilot/banyan/round2/sheets/*.png",
]
SPDX-FileCopyrightText = "NONE: crops of AI-generated concept art (OpenAI gpt-image); no rights claimed"
