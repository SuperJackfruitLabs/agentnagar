[[annotations]]
path = [
    "docs/research/2026-10-01-asset-to-sheet-pilot/banyan/round2/compare/*.png",
    "docs/research/2026-10-01-asset-to-sheet-pilot/banyan/round2/previews/clumps.png",
    "docs/research/2026-10-01-asset-to-sheet-pilot/banyan/round2/previews/pixel-sprites.png",
    "docs/research/2026-10-01-asset-to-sheet-pilot/bench-test/compare/*.png",
