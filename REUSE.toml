    "docs/research/2026-10-01-asset-to-sheet-pilot/bench-test/previews/pixel-bench.png",
    "docs/research/2026-10-01-asset-to-sheet-pilot/planter-benchmark/compare/*.png",
    "docs/research/2026-10-01-asset-to-sheet-pilot/planter-benchmark/previews/*.png",
]
SPDX-FileCopyrightText = "2026 Super Jackfruit Labs (OPC) Private Limited and contributors"
