<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1180" viewBox="0 0 1240 1180" role="img" aria-labelledby="map-title map-desc">
<title id="map-title">Agentnagar: open maker-city concept map</title>
<desc id="map-desc">Ten districts arranged around Jackfruit Square. A greenbelt borders the learning grove, orchard homes and festival fields. SJL workshops for AgentPod, Superpipeline, SuperMD and Supermessage, and independent maker studios with an evening night market, flank the square. Civic works, a market and an expedition harbour complete the connected public city. The labels name 10 districts and 25 facilities, F01 to F25, as listed in the city plan. Agentnagar is a working name. This is a planning diagram, not a playable map.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#20372e}.title{font-size:34px;font-weight:700}.sub{font-size:19px}.name{font-size:23px;font-weight:700}.body{font-size:18px}.meta{font-size:16px;fill:#475e52}</style>
