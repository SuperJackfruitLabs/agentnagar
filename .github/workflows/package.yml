# Packages the Agentnagar city client (city/godot and its Rust extension,
# city-godot) for every operating system Godot supports. Each job builds the
# extension natively for its runner (cross-building Linux arm64 with
# cargo-zigbuild), downloads Godot and its export templates, runs
# city/scripts/package.sh, which exports and smoke-tests, and uploads the
# packages as workflow artifacts, kept three days: a tag's release holds the
# packages for good. It runs on version tags and by hand only;
# on a tag it also publishes them as that tag's GitHub release.
#
# Optional secrets (each step that needs one is skipped without it):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_ALIAS, ANDROID_KEYSTORE_PASSWORD
#       the APK's release key (otherwise a generated debug key signs it)
#   MACOS_CERTIFICATE (a base64 .p12), MACOS_CERTIFICATE_PASSWORD,
#   MACOS_SIGNING_IDENTITY ("Developer ID Application: ...")
#       sign the .app (otherwise it is signed ad hoc)
#   APPLE_ID, APPLE_APP_PASSWORD, APPLE_TEAM_ID
#       notarise the signed .app; APPLE_TEAM_ID also goes into the iOS project
name: Package the city client

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.6.3"
  GODOT_STATUS: stable
  CARGO_TERM_COLOR: always
  # A tag names the packages; otherwise package.sh uses git describe.
  CITY_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux and Android
            os: ubuntu-24.04
            targets: linux-x86_64 linux-arm64 android-arm64
            rust_targets: aarch64-unknown-linux-gnu,aarch64-linux-android
            editor: linux.x86_64
            templates: linux_release.x86_64 linux_release.arm64 android_release.apk
          - name: Windows
            os: windows-2022
            targets: windows-x86_64
            rust_targets: x86_64-pc-windows-msvc
            editor: win64.exe
            templates: windows_release_x86_64.exe
          - name: macOS
            os: macos-15
            targets: macos-universal
            rust_targets: x86_64-apple-darwin,aarch64-apple-darwin
            editor: macos.universal
            templates: macos.zip
    defaults:
      run:
        shell: bash
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: city -> target
          key: package

      - name: Zig and cargo-zigbuild (the Linux arm64 cross build)
        if: runner.os == 'Linux'
        run: |
          # The zig and cargo-zigbuild the packages were first built with
          # (cargo-zigbuild 0.23 cannot link for macOS with zig 0.16).
          python3 -m pip install --user --break-system-packages "ziglang==0.15.2"
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' >"$HOME/.local/bin/zig"
          chmod +x "$HOME/.local/bin/zig"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          cargo install --locked cargo-zigbuild --version 0.23.4

      - name: Android SDK, NDK and JDK 17
        if: runner.os == 'Linux'
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >>"$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >>"$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >>"$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >>"$GITHUB_ENV"

      - name: Android release key
        if: runner.os == 'Linux' && env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode >"$RUNNER_TEMP/release.keystore"
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ANDROID_KEYSTORE_ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
          } >>"$GITHUB_ENV"

      - name: appimagetool
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/bin/appimagetool"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >>"$GITHUB_ENV"

      - name: Godot ${{ env.GODOT_VERSION }} and its export templates
        env:
          EDITOR_SUFFIX: ${{ matrix.editor }}
          TEMPLATES: ${{ matrix.templates }}
        run: bash .github/scripts/install-godot.sh

      - name: Package and smoke-test
        run: city/scripts/package.sh ${{ matrix.targets }}

      - name: Sign and notarise the macOS app
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode >"$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

          pkg="$(ls city/dist/agentnagar-city-*-macos-universal.zip)"
          work="$RUNNER_TEMP/sign"
          rm -rf "$work" && mkdir -p "$work"
          ditto -x -k "$pkg" "$work"
          app="$(find "$work" -maxdepth 1 -name '*.app' | head -n1)"
          # Libraries first, then the app with the hardened runtime.
          for lib in "$app"/Contents/Frameworks/*.dylib; do
            codesign --force --timestamp --options runtime --sign "$MACOS_SIGNING_IDENTITY" "$lib"
          done
          codesign --force --timestamp --options runtime \
            --entitlements city/packaging/macos/entitlements.plist \
            --sign "$MACOS_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarise.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$app"
            spctl --assess --type execute --verbose "$app"
          else
            echo "::notice::Signed but not notarised: set APPLE_ID, APPLE_APP_PASSWORD and APPLE_TEAM_ID to notarise."
          fi
          rm "$pkg"
          ditto -c -k --keepParent "$app" "$pkg"
          # The licence files package.sh put beside the .app.
          zip -qj "$pkg" "$work/LICENSE.txt" "$work/THIRD-PARTY-NOTICES.txt"
          security delete-keychain "$keychain"

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: agentnagar-city-${{ runner.os }}
          if-no-files-found: error
          path: |
            city/dist/*.tar.gz
            city/dist/*.zip
            city/dist/*.apk
            city/dist/*.AppImage

      - name: Upload the export and smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: logs-${{ runner.os }}
          path: city/dist/.stage/**/*.log
          include-hidden-files: true

  ios:
    name: iOS (Xcode project)
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: city -> target
          key: package-ios

      - name: Godot ${{ env.GODOT_VERSION }} and its export templates
        env:
          EDITOR_SUFFIX: macos.universal
          TEMPLATES: ios.zip
        run: bash .github/scripts/install-godot.sh

      - name: Export the Xcode project
        run: city/scripts/package.sh ios

      - name: Upload the Xcode project
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: agentnagar-city-iOS
          if-no-files-found: error
          path: city/dist/*-ios.zip

      - name: Upload the export log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: logs-iOS
          path: city/dist/.stage/**/*.log
          include-hidden-files: true

  # Best effort while gdext's web support is experimental: it needs nightly
  # Rust and the emscripten Godot's web templates were built with.
  web:
    name: Web (experimental)
    runs-on: ubuntu-24.04
    continue-on-error: true
    defaults:
      run:
        shell: bash
    env:
      # The emscripten Godot 4.6.3's web templates were built with (their
      # "Build configuration" line says so in the browser console). Keep it
      # in step with GODOT_VERSION.
      EMSCRIPTEN_VERSION: "4.0.20"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Nightly Rust with its source
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Stable Rust (the rest of the workspace)
        uses: dtolnay/rust-toolchain@stable

      - name: Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}

      - name: Godot ${{ env.GODOT_VERSION }} and its export templates
        env:
          EDITOR_SUFFIX: linux.x86_64
          TEMPLATES: web_dlink_release.zip
        run: bash .github/scripts/install-godot.sh

      - name: Package
        run: city/scripts/package.sh web

      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: agentnagar-city-web
          if-no-files-found: error
          path: city/dist/*-web.zip

  # On a version tag, publishes the packages as that tag's GitHub release,
  # with their SHA-256 sums. The web site is included when its best-effort
  # job produced one.
  release:
    name: Publish the release
    if: github.ref_type == 'tag' && !cancelled() && needs.package.result == 'success' && needs.ios.result == 'success'
    needs: [package, ios, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          pattern: agentnagar-city-*
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum -- * >SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Agentnagar city client $GITHUB_REF_NAME" \
            --notes-file ../.github/release-notes.md --generate-notes \
            -- *
